      <stop offset="0%" stop-color="#124866" />
      <stop offset="100%" stop-color="#16587B" />
    </linearGradient>
    <linearGradient id="cardGlow" x1="120" y1="70" x2="520" y2="350" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F5EEDD" stop-opacity="0.16" />
